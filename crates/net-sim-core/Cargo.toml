[package]
name = "net-sim-core"
version.workspace = true
edition.workspace = true

[dependencies]
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
    "auto-icmp-echo-reply",
] }
etherparse = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
